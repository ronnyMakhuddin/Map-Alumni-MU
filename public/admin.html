<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Peta Alumni</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A1630" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- LOGIN -->
  <section class="login" id="login">
    <form class="login-card" id="loginForm">
      <img src="logo-192.png" alt="" width="96" height="96" />
      <h1>Admin Peta Alumni</h1>
      <p>Pondok Pesantren Mamba'ul Ulum</p>
      <div class="field"><label for="pw">Kata sandi admin</label><input id="pw" type="password" autocomplete="current-password" required /></div>
      <p class="err" id="loginErr"></p>
      <button class="btn primary block" type="submit">Masuk</button>
      <a class="link" href="./">← Kembali ke peta</a>
    </form>
  </section>

  <!-- APP -->
  <div class="shell hidden" id="shell">
    <header class="appbar">
      <button class="icon-btn only-mobile" id="btnNav" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <img src="logo-192.png" alt="" width="32" height="32" />
      <div class="brand"><b>Admin Peta Alumni</b><small>Mamba'ul Ulum</small></div>
      <span class="spacer"></span>
      <a class="btn text light" href="./" target="_blank" rel="noopener">Buka peta</a>
      <button class="btn text light" id="btnLogout">Keluar</button>
    </header>
    <nav class="sidenav" id="sidenav">
      <button class="nav active" data-tab="data"><svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Data alumni<span class="count" id="cntPending"></span></button>
      <button class="nav" data-tab="unit"><svg viewBox="0 0 24 24"><path d="M5 13.2v4L12 21l7-3.8v-4L12 17zM12 3 1 9l11 6 9-4.9V17h2V9z"/></svg>Unit pendidikan</button>
      <button class="nav" data-tab="asrama"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Asrama</button>
      <button class="nav" data-tab="pengaturan"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>Pengaturan</button>
    </nav>
    <main class="content" id="content"></main>
  </div>

  <div class="scrim hidden" id="scrim"></div>
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true"></div>
  <div class="toast hidden" id="toast"></div>
  <input type="file" id="fileCsv" accept=".csv,text/csv" class="hidden" />

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/leaflet-maplibre-gl.js"></script>
  <script src="basemap.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
